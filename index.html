<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talabat · Ops Performance Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%23FF6B00'/%3E%3Ctext x='18' y='27' text-anchor='middle' font-size='23' font-weight='900' font-family='system-ui' fill='white'%3Et%3C/text%3E%3C/svg%3E" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── Talabat brand palette ───────────────────────────────── */
    :root {
      --talabat:        #FF6B00;
      --talabat-light:  #FF9A3C;
      --talabat-glow:   rgba(255,107,0,0.30);
      --bg:             #0f0d0a;
      --card:           #181410;
      --card-inner:     #131009;
      --border:         #2d2318;
      --border-inner:   #231d11;
      --border-upload:  #3a2e1a;
      --hover-tint:     #1c1208;
      --text:           #e8e0d5;
      --text-muted:     #a09080;
      --text-dim:       #6b5e4e;
      --grid-line:      #26200f;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
    .card       { background: var(--card);       border: 1px solid var(--border);       border-radius: 12px; }
    .card-inner { background: var(--card-inner); border: 1px solid var(--border-inner); border-radius: 8px;  }

    /* status badges — semantic colors intentional */
    .badge-under   { background: #3d1515; color: #fc8181; border: 1px solid #742a2a; }
    .badge-over    { background: #152a3d; color: #63b3ed; border: 1px solid #1e4a6e; }
    .badge-optimal { background: #152a1e; color: #68d391; border: 1px solid #1e5c38; }
    .badge-mixed   { background: #3d2400; color: var(--talabat-light); border: 1px solid #6e3d00; }
    .badge-deficit  { background: #3d1515; color: #fc8181; border: 1px solid #742a2a; }
    .badge-surplus  { background: #152a3d; color: #63b3ed; border: 1px solid #1e4a6e; }
    .badge-balanced { background: #152a1e; color: #68d391; border: 1px solid #1e5c38; }

    .upload-zone { border: 2px dashed var(--border-upload); border-radius: 12px; transition: all 0.2s; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--talabat); background: var(--hover-tint); }
    .upload-zone.loaded { border-color: #1e5c38; }

    .tab-active   { background: var(--talabat); color: #fff; box-shadow: 0 0 14px var(--talabat-glow); }
    .tab-inactive { color: var(--text-muted); }
    .tab-inactive:hover { color: var(--talabat); background: var(--hover-tint); }

    select, input[type="number"] {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 6px 10px;
    }
    select:focus, input[type="number"]:focus { outline: none; border-color: var(--talabat); box-shadow: 0 0 0 2px var(--talabat-glow); }
    input[type="range"] { accent-color: var(--talabat); background: transparent; }

    .metric-positive { color: #68d391; }
    .metric-negative { color: #fc8181; }
    .metric-neutral  { color: var(--text-muted); }

    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--card); }
    ::-webkit-scrollbar-thumb { background: var(--talabat); border-radius: 3px; opacity: 0.7; }

    /* table rows */
    tr:hover td { background: var(--hover-tint) !important; }

    /* divider */
    .divider { border-color: var(--border); }
  </style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useMemo, useRef } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const MONTH_ORDER = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const MONTH_DAYS  = { january:31, february:28, march:31, april:30, may:31, june:30, july:31, august:31, september:30, october:31, november:30, december:31 };

// ─── Embedded dataset (Logists_Metrics.xlsx, March–August 2026) ───────────────
const EMBEDDED_DATA = {
  months: ['March','April','May','June','July','August'],
  cities: ['Irbid','Jerash','Ajloun','Mafraq'],
  orders: {
    Irbid:  [450306, 354970, 487028, 365861, 247715, 335894],
    Jerash: [7068,   5396,   7749,   7165,   4904,   6592  ],
    Ajloun: [1790,   1591,   2208,   1703,   1160,   1447  ],
    Mafraq: [2432,   2257,   3127,   2422,   1671,   2097  ],
  },
  utr: {
    Irbid:  [1.78, 1.54, 1.49, 1.6,  1.7,  1.93],
    Jerash: [2.24, 2.12, 2.24, 2.33, 2.09, 2.13],
    Ajloun: [0.8,  0.89, 1.11, 0.92, 0.87, 1.03],
    Mafraq: [1.3,  1.2,  1.25, 1.32, 1.35, 1.56],
  },
  dt: {
    Irbid:  [33.1,  29.15, 31.23, 28.8,  27.77, 29.67],
    Jerash: [61.25, 98.58, 72.89, 40.76, 38.08, 39.09],
    Ajloun: [36.74, 32.6,  32.54, 31.65, 34.59, 35.52],
    Mafraq: [28.51, 26.86, 28.52, 28.17, 29.19, 29.33],
  },
  failRate: {
    Irbid:  [0.0203, 0.0125, 0.0133, 0.0144, 0.0158, 0.0147],
    Jerash: [0.0313, 0.0232, 0.0174, 0.0155, 0.023,  0.0234],
    Ajloun: [0.0615, 0.0629, 0.0566, 0.0517, 0.0216, 0.0436],
    Mafraq: [0.0276, 0.0266, 0.0224, 0.0173, 0.0293, 0.031 ],
  },
  extras: [{
    title: 'Rider-Fault (Transport) Fail Rate — August only',
    months: ['August'],
    values: {
      Irbid:  [0.0009484323767715362],
      Jerash: [0.001145475372279496],
      Ajloun: [0.02824858757062147],
      Mafraq: [0.010351966873706],
    },
  }],
};

// ─── Excel parser helpers ──────────────────────────────────────────────────────
function normalize(s) { return String(s || '').toLowerCase().replace(/[_\-\s]+/g, ' ').trim(); }
function rowIsBlank(row) { return !row || row.every(c => c === null || c === undefined || String(c).trim() === ''); }

function extractTables(rows) {
  const tables = []; let i = 0;
  while (i < rows.length) {
    if (rows[i] && normalize(rows[i][0]) === 'city') {
      let title = '';
      for (let j = i - 1; j >= 0; j--) { if (!rowIsBlank(rows[j])) { title = String(rows[j][0]).trim(); break; } }
      const months = rows[i].slice(1).map(c => String(c || '').trim()).filter(Boolean);
      const dataRows = []; let k = i + 1;
      while (k < rows.length) {
        if (rowIsBlank(rows[k]) || normalize(rows[k][0]) === 'city') break;
        dataRows.push(rows[k]); k++;
      }
      tables.push({ title, months, dataRows }); i = k;
    } else { i++; }
  }
  return tables;
}

function tableToValuesByCity(table) {
  const values = {};
  for (const row of table.dataRows) {
    const city = String(row[0] || '').trim(); if (!city) continue;
    values[city] = table.months.map((_, idx) => { const v = parseFloat(row[idx + 1]); return isNaN(v) ? null : v; });
  }
  return values;
}

const SHEET_MATCHERS = {
  orders:   n => n.includes('order'),
  utr:      n => n.includes('utr'),
  dt:       n => n.includes('delivery') || n === 'dt' || n.includes('dt time'),
  failRate: n => n.includes('fail'),
};

function parseWorkbookToDataset(wb) {
  const dataset = { months:[], cities: new Set(), orders:{}, utr:{}, dt:{}, failRate:{}, extras:[] };
  const primaryMonths = {};
  for (const sheetName of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, defval:null });
    const tables = extractTables(rows); if (!tables.length) continue;
    const normName = normalize(sheetName);
    let metricKey = null;
    for (const [k, test] of Object.entries(SHEET_MATCHERS)) { if (test(normName)) { metricKey = k; break; } }
    tables.forEach((table, idx) => {
      const vals = tableToValuesByCity(table);
      Object.keys(vals).forEach(c => dataset.cities.add(c));
      if (idx === 0 && metricKey) { dataset[metricKey] = vals; primaryMonths[metricKey] = table.months; }
      else { dataset.extras.push({ title: table.title || sheetName, months: table.months, values: vals }); }
    });
  }
  const monthSet = new Set();
  Object.values(primaryMonths).forEach(ms => ms.forEach(m => monthSet.add(m)));
  const arr = [...monthSet];
  arr.sort((a,b) => { const ia = MONTH_ORDER.indexOf(normalize(a)), ib = MONTH_ORDER.indexOf(normalize(b)); return (ia>=0&&ib>=0) ? ia-ib : a.localeCompare(b); });
  dataset.months = arr; dataset.cities = [...dataset.cities].sort(); return dataset;
}

// ─── Records builder ──────────────────────────────────────────────────────────
function buildRecords(dataset) {
  const records = [];
  for (const city of dataset.cities)
    dataset.months.forEach((month, i) => records.push({
      city, month,
      orders:   dataset.orders?.[city]?.[i]   ?? null,
      utr:      dataset.utr?.[city]?.[i]      ?? null,
      dt:       dataset.dt?.[city]?.[i]       ?? null,
      failRate: dataset.failRate?.[city]?.[i] ?? null,
    }));
  return records;
}

// ─── Supply status (EXACT logic — do not alter) ───────────────────────────────
// rate ≥ target AND time ≤ target → Optimal
// rate ≥ target AND time > target → Under Supply
// rate < target AND time ≤ target → Over Supply
// rate < target AND time > target → Mixed
function calcSupplyStatus(utr, targetUtr, dt, targetDt) {
  const utrOk = utr != null && targetUtr != null ? utr >= targetUtr : null;
  const dtOk  = dt  != null && targetDt  != null ? dt  <= targetDt  : null;
  if (utrOk === null && dtOk === null) return 'Unknown';
  if (utrOk === true  && dtOk === true)  return 'Optimal';
  if (utrOk === true  && dtOk === false) return 'Under';
  if (utrOk === false && dtOk === true)  return 'Over';
  return 'Mixed';
}

const STATUS_BADGE = {
  Under:   { cls: 'badge-under',   label: '⬇ Under Supply' },
  Over:    { cls: 'badge-over',    label: '⬆ Over Supply'  },
  Optimal: { cls: 'badge-optimal', label: '✓ Optimal'      },
  Mixed:   { cls: 'badge-mixed',   label: '◈ Mixed'        },
  Unknown: { cls: 'bg-stone-900 text-stone-400 border border-stone-700', label: '— Unknown' },
};

// ─── Rider calculations ───────────────────────────────────────────────────────
// Formula: Active Riders = Monthly Orders ÷ (UTR × Days)
// UTR is treated as "orders per rider per day" over the reporting period.
function calcRiders(orders, utr, targetUtr, days) {
  if (orders == null || utr == null || !days || utr <= 0) return null;
  const active = Math.round(orders / (utr * days));
  const needed = Math.round(orders / (targetUtr * days));
  const gap    = needed - active;
  const gapPct = active > 0 ? Math.round((gap / active) * 100) : 0;
  return { active, needed, gap, gapPct };
}

function getRiderStatus(gap, pct) {
  if (gap == null) return 'Unknown';
  const absPct = Math.abs(pct);
  if (absPct <= 5) return 'Balanced';
  return gap > 0 ? 'Deficit' : 'Surplus';
}

const RIDER_BADGE = {
  Deficit:  { cls: 'badge-deficit',  label: '▼ Deficit'  },
  Surplus:  { cls: 'badge-surplus',  label: '▲ Surplus'  },
  Balanced: { cls: 'badge-balanced', label: '✓ Balanced' },
  Unknown:  { cls: 'bg-stone-900 text-stone-400 border border-stone-700', label: '—' },
};

// ─── Components ───────────────────────────────────────────────────────────────
function StatusBadge({ status }) {
  const { cls, label } = STATUS_BADGE[status] || STATUS_BADGE.Unknown;
  return <span className={`text-xs font-semibold px-2 py-1 rounded-full ${cls}`}>{label}</span>;
}

function RiderBadge({ status }) {
  const { cls, label } = RIDER_BADGE[status] || RIDER_BADGE.Unknown;
  return <span className={`text-xs font-semibold px-2 py-1 rounded-full ${cls}`}>{label}</span>;
}

function MetricCard({ title, value, sub, color = 'text-white', icon }) {
  return (
    <div className="card p-4 flex flex-col gap-1">
      <div className="flex items-center gap-2 text-stone-400 text-xs uppercase tracking-wider mb-1">
        {icon && <span>{icon}</span>}{title}
      </div>
      <div className={`text-2xl font-bold ${color}`}>{value ?? '—'}</div>
      {sub && <div className="text-xs text-stone-500">{sub}</div>}
    </div>
  );
}

// ─── SVG Charts ───────────────────────────────────────────────────────────────
function SimpleBarChart({ data, xKey, yKey, height = 220, color = '#FF6B00', targetLine = null, valueSuffix = '' }) {
  const pad = { t: 10, r: 10, b: 30, l: 8 };
  const W = 600, H = height, iW = W - pad.l - pad.r, iH = H - pad.t - pad.b;
  const maxV = Math.max(1, ...data.map(d => d[yKey] || 0), targetLine || 0) * 1.1;
  const bGap = 8, bW = data.length ? Math.max(6, iW / data.length - bGap) : 20;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={height} preserveAspectRatio="xMidYMid meet">
      {[0,.25,.5,.75,1].map((f,i) => <line key={i} x1={pad.l} x2={W-pad.r} y1={pad.t+iH*(1-f)} y2={pad.t+iH*(1-f)} stroke="#26200f" strokeWidth="1"/>)}
      {targetLine != null && <>
        <line x1={pad.l} x2={W-pad.r} y1={pad.t+iH*(1-targetLine/maxV)} y2={pad.t+iH*(1-targetLine/maxV)} stroke="#fc8181" strokeWidth="1.5" strokeDasharray="4 3"/>
        <text x={W-pad.r} y={pad.t+iH*(1-targetLine/maxV)-4} fill="#fc8181" fontSize="9" textAnchor="end">Target {targetLine}{valueSuffix}</text>
      </>}
      {data.map((d, i) => {
        const v = d[yKey] || 0, bH = (v/maxV)*iH;
        const x = pad.l + i*(iW/data.length) + bGap/2, y = pad.t + iH - bH;
        return <g key={i}>
          <rect x={x} y={y} width={bW} height={bH} rx="3" fill={color}/>
          <text x={x+bW/2} y={pad.t+iH+14} fill="#6b5e4e" fontSize="9" textAnchor="middle">
            {String(d[xKey]).length > 9 ? String(d[xKey]).slice(0,8)+'…' : d[xKey]}
          </text>
          <text x={x+bW/2} y={y-4} fill="#a09080" fontSize="9" textAnchor="middle">
            {typeof v==='number' ? (v<10 ? v.toFixed(2) : v.toLocaleString()) : v}{valueSuffix}
          </text>
        </g>;
      })}
    </svg>
  );
}

function SimpleGroupedBarChart({ data, xKey, keys, height = 260 }) {
  const pad = { t: 20, r: 10, b: 50, l: 8 };
  const W = 600, H = height, iW = W - pad.l - pad.r, iH = H - pad.t - pad.b;
  const allV = keys.flatMap(k => data.map(d => d[k.key] || 0));
  const maxV = Math.max(1, ...allV) * 1.1;
  const gW = data.length ? iW / data.length : 40;
  const bGap = 3, bW = Math.max(4, (gW - bGap * (keys.length + 1)) / keys.length);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={height} preserveAspectRatio="xMidYMid meet">
      {[0,.25,.5,.75,1].map((f,i) => <line key={i} x1={pad.l} x2={W-pad.r} y1={pad.t+iH*(1-f)} y2={pad.t+iH*(1-f)} stroke="#26200f" strokeWidth="1"/>)}
      {data.map((d, gi) => {
        const gX = pad.l + gi * gW;
        return <g key={gi}>
          {keys.map((k, ki) => {
            const v = d[k.key] || 0, bH = (v/maxV)*iH;
            const x = gX + bGap + ki*(bW+bGap), y = pad.t+iH-bH;
            return <g key={ki}>
              <rect x={x} y={y} width={bW} height={bH} rx="2" fill={k.color}/>
              {v > 0 && <text x={x+bW/2} y={y-3} fill="#a09080" fontSize="8" textAnchor="middle">{v.toLocaleString()}</text>}
            </g>;
          })}
          <text x={gX+gW/2} y={H-30} fill="#6b5e4e" fontSize="9" textAnchor="middle">
            {String(d[xKey]).length > 9 ? String(d[xKey]).slice(0,8)+'…' : d[xKey]}
          </text>
        </g>;
      })}
      <g transform={`translate(${pad.l}, ${H-14})`}>
        {keys.map((k,i) => <g key={i} transform={`translate(${i*100},0)`}>
          <rect width="8" height="8" fill={k.color} rx="2"/>
          <text x="12" y="7" fill="#a09080" fontSize="9">{k.label}</text>
        </g>)}
      </g>
    </svg>
  );
}

function SimpleLineChart({ data, xKey, yKeys, height = 220, targetLine = null, valueSuffix = '' }) {
  const pad = { t: 15, r: 15, b: 30, l: 10 };
  const W = 600, H = height, iW = W - pad.l - pad.r, iH = H - pad.t - pad.b;
  const keys = Array.isArray(yKeys) ? yKeys : [yKeys];
  const allV = keys.flatMap(k => data.map(d => d[k.key] || 0));
  const maxV = Math.max(1, ...allV, targetLine || 0) * 1.1;
  const minV = Math.min(0, ...allV);
  const range = maxV - minV || 1;
  const lines = keys.map(k => ({
    ...k,
    pts: data.map((d, i) => ({
      x: pad.l + (data.length > 1 ? (i/(data.length-1))*iW : iW/2),
      y: pad.t + iH - ((d[k.key]-minV)/range)*iH,
      val: d[k.key], label: d[xKey],
    })),
  }));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={height} preserveAspectRatio="xMidYMid meet">
      {[0,.25,.5,.75,1].map((f,i) => <line key={i} x1={pad.l} x2={W-pad.r} y1={pad.t+iH*f} y2={pad.t+iH*f} stroke="#26200f" strokeWidth="1"/>)}
      {targetLine != null && <>
        <line x1={pad.l} x2={W-pad.r} y1={pad.t+iH-((targetLine-minV)/range)*iH} y2={pad.t+iH-((targetLine-minV)/range)*iH} stroke="#fc8181" strokeWidth="1.5" strokeDasharray="4 3"/>
        <text x={W-pad.r} y={pad.t+iH-((targetLine-minV)/range)*iH-4} fill="#fc8181" fontSize="9" textAnchor="end">Target {targetLine}{valueSuffix}</text>
      </>}
      {lines.map((line, li) => <g key={li}>
        <path d={line.pts.map((p,i) => `${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ')} fill="none" stroke={line.color} strokeWidth="2.5"/>
        {line.pts.map((p,i) => <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={line.color}/>)}
      </g>)}
      {lines[0].pts.map((p,i) => <text key={i} x={p.x} y={H-8} fill="#6b5e4e" fontSize="9" textAnchor="middle">
        {String(p.label).length > 9 ? String(p.label).slice(0,8)+'…' : p.label}
      </text>)}
      {keys.length > 1 && <g>{keys.map((k,i) => <g key={i} transform={`translate(${pad.l+i*90},2)`}>
        <rect width="8" height="8" fill={k.color} rx="2"/>
        <text x="12" y="7" fill="#a09080" fontSize="9">{k.label}</text>
      </g>)}</g>}
    </svg>
  );
}

// ─── Upload Zone ──────────────────────────────────────────────────────────────
function UploadZone({ onFile, loaded, fileName }) {
  const [drag, setDrag] = useState(false);
  const ref = useRef();
  const handle = useCallback(async (file) => {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const ds = parseWorkbookToDataset(wb);
      if (!ds.cities.length) { alert('No "City" tables found. Each sheet needs a City header row followed by month columns.'); return; }
      onFile(ds, file.name);
    } catch(e) { alert('Error reading file: ' + e.message); }
  }, [onFile]);
  return (
    <div className={`upload-zone p-6 text-center cursor-pointer ${drag?'drag-over':''} ${loaded?'border-green-700':''}`}
      onClick={() => ref.current.click()}
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={e => { e.preventDefault(); setDrag(false); handle(e.dataTransfer.files[0]); }}>
      <input ref={ref} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={e => handle(e.target.files[0])}/>
      <div className="text-3xl mb-2">{loaded ? '✅' : '📊'}</div>
      <div className="font-semibold text-sm text-stone-200">{loaded ? fileName : 'Upload Logistics Metrics workbook'}</div>
      <div className="text-xs text-stone-500 mt-1">
        {loaded ? 'Click to replace with a new month\'s file' : 'Sheets: Orders, UTR, Delivery Time, Fail Rate — each City × Month'}
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [dataset,     setDataset]     = useState(EMBEDDED_DATA);
  const [fileName,    setFileName]    = useState('Logists_Metrics.xlsx');
  const [isDefault,   setIsDefault]   = useState(true);
  const [activeTab,   setActiveTab]   = useState('overview');
  const [cityFilter,  setCityFilter]  = useState('All');
  const [monthFilter, setMonthFilter] = useState('All');
  const [targetUtr,   setTargetUtr]   = useState(1.8);
  const [targetDt,    setTargetDt]    = useState(23);
  const [riderDays,   setRiderDays]   = useState(30);

  const records = useMemo(() => buildRecords(dataset), [dataset]);

  const filteredRecords = useMemo(() => records.filter(r =>
    (cityFilter  === 'All' || r.city  === cityFilter) &&
    (monthFilter === 'All' || r.month === monthFilter)
  ), [records, cityFilter, monthFilter]);

  // ── Overview aggregates ──
  const metrics = useMemo(() => {
    if (!filteredRecords.length) return null;
    const wO = filteredRecords.filter(r => r.orders   != null);
    const wU = filteredRecords.filter(r => r.utr      != null);
    const wD = filteredRecords.filter(r => r.dt       != null);
    const wF = filteredRecords.filter(r => r.failRate != null);
    const totalOrders = wO.length ? Math.round(wO.reduce((s,r) => s+r.orders,   0)) : null;
    const avgUtr      = wU.length ? parseFloat((wU.reduce((s,r) => s+r.utr,      0)/wU.length).toFixed(2)) : null;
    const avgDt       = wD.length ? parseFloat((wD.reduce((s,r) => s+r.dt,       0)/wD.length).toFixed(1)) : null;
    const avgFail     = wF.length ? parseFloat(((wF.reduce((s,r) => s+r.failRate, 0)/wF.length)*100).toFixed(2)) : null;
    return { totalOrders, avgUtr, avgDt, avgFail, status: calcSupplyStatus(avgUtr,targetUtr,avgDt,targetDt) };
  }, [filteredRecords, targetUtr, targetDt]);

  // ── City-level aggregates ──
  const cityAgg = useMemo(() => {
    const agg = {};
    for (const r of filteredRecords) {
      if (!agg[r.city]) agg[r.city] = { city:r.city, orders:0, utrS:0, utrN:0, dtS:0, dtN:0, failS:0, failN:0 };
      const a = agg[r.city];
      if (r.orders   != null) a.orders += r.orders;
      if (r.utr      != null) { a.utrS  += r.utr;      a.utrN++;  }
      if (r.dt       != null) { a.dtS   += r.dt;        a.dtN++;   }
      if (r.failRate != null) { a.failS += r.failRate;  a.failN++; }
    }
    return Object.values(agg).map(a => ({
      city:     a.city,
      Orders:   Math.round(a.orders),
      UTR:      a.utrN  ? parseFloat((a.utrS/a.utrN).toFixed(2))          : null,
      DT:       a.dtN   ? parseFloat((a.dtS/a.dtN).toFixed(1))             : null,
      FailRate: a.failN ? parseFloat(((a.failS/a.failN)*100).toFixed(2))   : null,
    })).sort((a,b) => b.Orders - a.Orders);
  }, [filteredRecords]);

  // ── Month-level aggregates ──
  const monthAgg = useMemo(() => {
    const agg = {};
    for (const r of filteredRecords) {
      if (!agg[r.month]) agg[r.month] = { month:r.month, orders:0, utrS:0, utrN:0, dtS:0, dtN:0, failS:0, failN:0 };
      const a = agg[r.month];
      if (r.orders   != null) a.orders += r.orders;
      if (r.utr      != null) { a.utrS += r.utr;       a.utrN++; }
      if (r.dt       != null) { a.dtS  += r.dt;         a.dtN++;  }
      if (r.failRate != null) { a.failS += r.failRate;  a.failN++; }
    }
    return dataset.months.filter(m => agg[m]).map(m => ({
      month:    m,
      Orders:   Math.round(agg[m].orders),
      UTR:      agg[m].utrN  ? parseFloat((agg[m].utrS/agg[m].utrN).toFixed(2))         : null,
      DT:       agg[m].dtN   ? parseFloat((agg[m].dtS/agg[m].dtN).toFixed(1))            : null,
      FailRate: agg[m].failN ? parseFloat(((agg[m].failS/agg[m].failN)*100).toFixed(2))  : null,
    }));
  }, [filteredRecords, dataset.months]);

  // ── Supply per city ──
  const citySupply = useMemo(() =>
    cityAgg.map(d => ({ ...d, status: calcSupplyStatus(d.UTR,targetUtr,d.DT,targetDt) })),
    [cityAgg, targetUtr, targetDt]);

  // ── Rider calculations per city ──
  // Effective days: if month selected use that month's days, else use riderDays setting
  const effectiveDays = useMemo(() => {
    if (monthFilter !== 'All') {
      const days = MONTH_DAYS[normalize(monthFilter)];
      return days || riderDays;
    }
    return riderDays;
  }, [monthFilter, riderDays]);

  const riderData = useMemo(() => cityAgg.map(d => {
    const r = calcRiders(d.Orders, d.UTR, targetUtr, effectiveDays);
    return {
      city: d.city, orders: d.Orders, utr: d.UTR,
      active:  r ? r.active  : null,
      needed:  r ? r.needed  : null,
      gap:     r ? r.gap     : null,
      gapPct:  r ? r.gapPct  : null,
      status:  r ? getRiderStatus(r.gap, r.gapPct) : 'Unknown',
    };
  }), [cityAgg, targetUtr, effectiveDays]);

  const riderSummary = useMemo(() => {
    const withData = riderData.filter(d => d.active != null);
    if (!withData.length) return null;
    const totalActive = withData.reduce((s,d) => s + d.active, 0);
    const totalNeeded = withData.reduce((s,d) => s + d.needed, 0);
    return { totalActive, totalNeeded, totalGap: totalNeeded - totalActive };
  }, [riderData]);

  const COLORS = { orders:'#FF6B00', utr:'#68d391', dt:'#f6ad55', fail:'#fc8181', active:'#FF6B00', needed:'#f6ad55' };

  const tabs = [
    { id:'overview', label:'Overview' },
    { id:'cities',   label:'By City'  },
    { id:'trends',   label:'Trends'   },
    { id:'fail',     label:'Fail Rate' },
    { id:'supply',   label:'Supply'   },
    { id:'riders',   label:'Riders'   },
  ];

  return (
    <div className="min-h-screen p-4 md:p-6 max-w-7xl mx-auto">

      {/* ── Header ── */}
      <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div className="flex items-center gap-4">
          {/* Talabat logo */}
          <svg width="130" height="36" viewBox="0 0 130 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="talabat">
            <rect width="36" height="36" rx="8" fill="#FF6B00"/>
            {/* delivery bag */}
            <path d="M10 15 C10 11 13 9 18 9 C23 9 26 11 26 15 L26 25 C26 27 24.5 28 23 28 L13 28 C11.5 28 10 27 10 25 Z" fill="white"/>
            <path d="M14 15 C14 12.5 15.8 11 18 11 C20.2 11 22 12.5 22 15" stroke="#FF6B00" strokeWidth="2" strokeLinecap="round" fill="none"/>
            <circle cx="15" cy="22" r="1.5" fill="#FF6B00"/>
            <circle cx="21" cy="22" r="1.5" fill="#FF6B00"/>
            {/* wordmark */}
            <text x="46" y="25" fontFamily="system-ui, -apple-system, sans-serif" fontWeight="800" fontSize="20" fill="white" letterSpacing="-0.5">talabat</text>
          </svg>
          <div className="h-8 w-px bg-stone-700"/>
          <div>
            <p className="text-xs text-stone-500 uppercase tracking-widest">Ops Performance Dashboard</p>
            <p className="text-xs text-stone-600 mt-0.5">Jordan · All data stays in your browser</p>
          </div>
        </div>
        {metrics && <StatusBadge status={metrics.status} />}
      </div>

      {/* ── Upload ── */}
      <div className="card p-4 mb-6">
        <div className="flex items-center justify-between mb-3">
          <span className="text-xs font-semibold text-stone-400 uppercase tracking-wider">Data Source</span>
          {isDefault && <span className="text-xs text-orange-400">Embedded: Logists_Metrics.xlsx (Mar–Aug)</span>}
        </div>
        <UploadZone loaded={true} fileName={fileName}
          onFile={(ds,name) => { setDataset(ds); setFileName(name); setIsDefault(false); setCityFilter('All'); setMonthFilter('All'); }} />
      </div>

      {/* ── Filters ── */}
      <div className="card p-4 mb-4 flex flex-wrap gap-3 items-center">
        <div className="flex items-center gap-2">
          <label className="text-xs text-stone-400 whitespace-nowrap">City</label>
          <select className="rounded-lg px-3 py-1.5 text-sm" value={cityFilter} onChange={e => setCityFilter(e.target.value)}>
            <option value="All">All Cities</option>
            {dataset.cities.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs text-stone-400 whitespace-nowrap">Month</label>
          <select className="rounded-lg px-3 py-1.5 text-sm" value={monthFilter} onChange={e => setMonthFilter(e.target.value)}>
            <option value="All">All Months</option>
            {dataset.months.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </div>
        <div className="flex items-center gap-2 ml-auto">
          <label className="text-xs text-stone-400">Target UTR</label>
          <input type="number" step="0.1" min="0" max="10" className="rounded-lg px-2 py-1.5 text-sm w-20 text-center"
            value={targetUtr} onChange={e => setTargetUtr(Number(e.target.value))} />
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs text-stone-400">Target DT</label>
          <input type="number" min="0" max="120" className="rounded-lg px-2 py-1.5 text-sm w-20 text-center"
            value={targetDt} onChange={e => setTargetDt(Number(e.target.value))} />
          <span className="text-xs text-stone-500">min</span>
        </div>
      </div>

      {/* ── Tab bar ── */}
      <div className="flex gap-1 mb-4 rounded-xl p-1 w-fit flex-wrap" style={{background:'#131009',border:'1px solid #2d2318'}}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setActiveTab(t.id)}
            className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${activeTab===t.id ? 'tab-active' : 'tab-inactive'}`}>
            {t.label}
          </button>
        ))}
      </div>

      {/* ════════════════ OVERVIEW ════════════════ */}
      {activeTab === 'overview' && <>
        {metrics && (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
            <MetricCard title="Total Orders"   value={metrics.totalOrders?.toLocaleString()} icon="📦" />
            <MetricCard title="Avg UTR"        value={metrics.avgUtr}  icon="⚡"
              color={metrics.avgUtr != null && metrics.avgUtr >= targetUtr ? 'metric-positive' : 'metric-negative'}
              sub={`Target: ${targetUtr}`} />
            <MetricCard title="Avg DT"         value={metrics.avgDt != null ? `${metrics.avgDt} min` : null} icon="🕐"
              color={metrics.avgDt != null && metrics.avgDt <= targetDt ? 'metric-positive' : 'metric-negative'}
              sub={`Target: ${targetDt} min`} />
            <MetricCard title="Avg Fail Rate"  value={metrics.avgFail != null ? `${metrics.avgFail}%` : null} icon="❌"
              color={metrics.avgFail != null && metrics.avgFail > 3 ? 'metric-negative' : 'metric-neutral'} />
          </div>
        )}
        {metrics && (
          <div className="card p-4 mb-4">
            <div className="flex items-center gap-3 mb-2">
              <span className="text-sm font-semibold text-white">Supply Status</span>
              <StatusBadge status={metrics.status} />
            </div>
            <p className="text-xs text-stone-500">
              {metrics.status === 'Optimal' && `UTR ${metrics.avgUtr} ≥ ${targetUtr} and DT ${metrics.avgDt} min ≤ ${targetDt} min — supply is balanced.`}
              {metrics.status === 'Under'   && `UTR ${metrics.avgUtr} ≥ ${targetUtr} but DT ${metrics.avgDt} min exceeds ${targetDt} min — riders are busy but deliveries are slow.`}
              {metrics.status === 'Over'    && `UTR ${metrics.avgUtr} below target ${targetUtr} and DT ${metrics.avgDt} min ≤ ${targetDt} min — too many riders, underutilized.`}
              {metrics.status === 'Mixed'   && `UTR ${metrics.avgUtr} below target and DT ${metrics.avgDt} min exceeds ${targetDt} min — both metrics off.`}
            </p>
          </div>
        )}
        {cityAgg.length > 0 && (
          <div className="card p-4">
            <div className="text-sm font-medium text-stone-300 mb-3">Orders by City</div>
            <SimpleBarChart data={cityAgg} xKey="city" yKey="Orders" color={COLORS.orders} />
          </div>
        )}
      </>}

      {/* ════════════════ BY CITY ════════════════ */}
      {activeTab === 'cities' && (
        <div className="card p-5 space-y-6">
          <div>
            <div className="text-sm font-semibold text-white mb-4">Performance by City</div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-xs text-stone-500 uppercase border-b border-stone-800">
                    <th className="text-left py-2 pr-4">City</th>
                    <th className="text-right py-2 pr-4">Orders</th>
                    <th className="text-right py-2 pr-4">UTR</th>
                    <th className="text-right py-2 pr-4">DT (min)</th>
                    <th className="text-right py-2 pr-4">Fail Rate</th>
                    <th className="text-left py-2">Status</th>
                  </tr>
                </thead>
                <tbody>
                  {citySupply.map(row => (
                    <tr key={row.city} className="border-b border-stone-800/50 hover:bg-orange-950/20 transition-colors">
                      <td className="py-2 pr-4 font-medium text-white">{row.city}</td>
                      <td className="text-right py-2 pr-4 text-stone-300">{row.Orders?.toLocaleString()}</td>
                      <td className={`text-right py-2 pr-4 ${row.UTR != null && row.UTR >= targetUtr ? 'metric-positive' : 'metric-negative'}`}>{row.UTR ?? '—'}</td>
                      <td className={`text-right py-2 pr-4 ${row.DT != null && row.DT <= targetDt ? 'metric-positive' : row.DT != null ? 'metric-negative' : 'text-stone-500'}`}>{row.DT ?? '—'}</td>
                      <td className={`text-right py-2 pr-4 ${row.FailRate != null && row.FailRate > 3 ? 'metric-negative' : 'metric-neutral'}`}>{row.FailRate != null ? `${row.FailRate}%` : '—'}</td>
                      <td className="py-2"><StatusBadge status={row.status}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div>
            <div className="text-xs text-stone-400 mb-2">UTR by City</div>
            <SimpleBarChart data={cityAgg} xKey="city" yKey="UTR" color={COLORS.utr} targetLine={targetUtr} />
          </div>
          <div>
            <div className="text-xs text-stone-400 mb-2">Delivery Time (min) by City</div>
            <SimpleBarChart data={cityAgg} xKey="city" yKey="DT" color={COLORS.dt} targetLine={targetDt} valueSuffix=" min" />
          </div>
        </div>
      )}

      {/* ════════════════ TRENDS ════════════════ */}
      {activeTab === 'trends' && (
        <div className="space-y-4">
          {monthAgg.length > 0 ? <>
            <div className="card p-5">
              <div className="text-sm font-semibold text-white mb-3">Orders Over Time</div>
              <SimpleLineChart data={monthAgg} xKey="month" yKeys={[{key:'Orders',color:COLORS.orders,label:'Orders'}]} height={230} />
            </div>
            <div className="card p-5">
              <div className="text-sm font-semibold text-white mb-3">UTR Over Time</div>
              <SimpleLineChart data={monthAgg} xKey="month" yKeys={[{key:'UTR',color:COLORS.utr,label:'UTR'}]} height={230} targetLine={targetUtr} />
            </div>
            <div className="card p-5">
              <div className="text-sm font-semibold text-white mb-3">Delivery Time Over Time</div>
              <SimpleLineChart data={monthAgg} xKey="month" yKeys={[{key:'DT',color:COLORS.dt,label:'DT (min)'}]} height={230} targetLine={targetDt} valueSuffix=" min" />
            </div>
          </> : <div className="card p-10 text-center text-stone-600">No month-level data for this filter.</div>}
        </div>
      )}

      {/* ════════════════ FAIL RATE ════════════════ */}
      {activeTab === 'fail' && (
        <div className="space-y-4">
          <div className="card p-5">
            <div className="text-sm font-semibold text-white mb-3">Net Fail Rate by City</div>
            {cityAgg.length > 0
              ? <SimpleBarChart data={cityAgg} xKey="city" yKey="FailRate" color={COLORS.fail} valueSuffix="%"/>
              : <div className="text-stone-600 text-sm py-6 text-center">No data.</div>}
          </div>
          <div className="card p-5">
            <div className="text-sm font-semibold text-white mb-3">Net Fail Rate Over Time</div>
            {monthAgg.length > 0
              ? <SimpleLineChart data={monthAgg} xKey="month" yKeys={[{key:'FailRate',color:COLORS.fail,label:'Fail Rate %'}]} height={220} valueSuffix="%"/>
              : <div className="text-stone-600 text-sm py-6 text-center">No trend data.</div>}
          </div>
          {dataset.extras && dataset.extras.map((extra, idx) => {
            const rows = dataset.cities
              .filter(c => cityFilter === 'All' || c === cityFilter)
              .map(c => ({ city:c, pct: extra.values[c] ? parseFloat((extra.values[c][0]*100).toFixed(2)) : null }))
              .filter(r => r.pct != null);
            return (
              <div className="card p-5" key={idx}>
                <div className="text-sm font-semibold text-white mb-1">{extra.title}</div>
                <div className="text-xs text-stone-500 mb-3">Months: {extra.months.join(', ')}</div>
                {rows.length > 0
                  ? <SimpleBarChart data={rows} xKey="city" yKey="pct" color="#FF9A3C" valueSuffix="%"/>
                  : <div className="text-stone-600 text-sm py-4 text-center">No data for current filter.</div>}
              </div>
            );
          })}
        </div>
      )}

      {/* ════════════════ SUPPLY ════════════════ */}
      {activeTab === 'supply' && (
        <div className="space-y-4">
          <div className="card p-4 flex flex-wrap gap-6 items-center">
            <div>
              <label className="text-xs text-stone-400 block mb-1">Target UTR</label>
              <div className="flex items-center gap-3">
                <input type="range" min="0" max="3" step="0.1" value={targetUtr} onChange={e => setTargetUtr(Number(e.target.value))} className="w-32"/>
                <span className="text-white font-bold w-12">{targetUtr}</span>
              </div>
            </div>
            <div>
              <label className="text-xs text-stone-400 block mb-1">Target DT (min)</label>
              <div className="flex items-center gap-3">
                <input type="range" min="10" max="100" value={targetDt} onChange={e => setTargetDt(Number(e.target.value))} className="w-32"/>
                <span className="text-white font-bold w-16">{targetDt} min</span>
              </div>
            </div>
          </div>

          <div className="card p-4">
            <div className="text-xs font-semibold text-stone-400 uppercase tracking-wider mb-3">Status Logic</div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
              {[
                { status:'Optimal', desc:'UTR ≥ target AND DT ≤ target' },
                { status:'Under',   desc:'UTR ≥ target AND DT > target' },
                { status:'Over',    desc:'UTR < target AND DT ≤ target' },
                { status:'Mixed',   desc:'UTR < target AND DT > target' },
              ].map(({status,desc}) => (
                <div key={status} className="card-inner p-3">
                  <StatusBadge status={status}/>
                  <p className="text-stone-500 mt-2">{desc}</p>
                </div>
              ))}
            </div>
          </div>

          <div className="card p-5">
            <div className="text-sm font-semibold text-white mb-3">Supply Status by City</div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-xs text-stone-500 uppercase border-b border-stone-800">
                    <th className="text-left py-2 pr-4">City</th>
                    <th className="text-right py-2 pr-4">UTR</th>
                    <th className="text-right py-2 pr-4">DT (min)</th>
                    <th className="text-left py-2">Status</th>
                  </tr>
                </thead>
                <tbody>
                  {citySupply.map(row => (
                    <tr key={row.city} className="border-b border-stone-800/50 hover:bg-orange-950/20">
                      <td className="py-2 pr-4 font-medium text-white">{row.city}</td>
                      <td className={`text-right py-2 pr-4 ${row.UTR != null && row.UTR >= targetUtr ? 'metric-positive' : 'metric-negative'}`}>{row.UTR ?? '—'}</td>
                      <td className={`text-right py-2 pr-4 ${row.DT != null && row.DT <= targetDt ? 'metric-positive' : row.DT != null ? 'metric-negative' : 'text-stone-500'}`}>{row.DT ?? '—'}</td>
                      <td className="py-2"><StatusBadge status={row.status}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ════════════════ RIDERS ════════════════ */}
      {activeTab === 'riders' && (
        <div className="space-y-4">

          {/* Methodology note */}
          <div className="card p-4 text-xs text-stone-500 space-y-1">
            <p className="text-stone-300 font-medium text-sm mb-1">How rider counts are calculated</p>
            <p><span className="text-stone-400">Formula:</span> Active Riders = Monthly Orders ÷ (UTR × Days in Period)</p>
            <p><span className="text-stone-400">Assumes UTR =</span> average orders completed per active rider per day.</p>
            <p><span className="text-stone-400">Riders Needed</span> = same formula using Target UTR instead of actual UTR.</p>
            <p className="text-orange-400 pt-1">Adjust "Days in Period" below to match the reporting window.</p>
          </div>

          {/* Config */}
          <div className="card p-4 flex flex-wrap gap-6 items-center">
            <div>
              <label className="text-xs text-stone-400 block mb-1">Days in Period</label>
              <div className="flex items-center gap-3">
                <input type="range" min="1" max="31" value={effectiveDays}
                  onChange={e => setRiderDays(Number(e.target.value))} className="w-32"
                  disabled={monthFilter !== 'All'} />
                <span className="text-white font-bold w-16">{effectiveDays} days</span>
                {monthFilter !== 'All' && <span className="text-xs text-orange-400">(auto from {monthFilter})</span>}
              </div>
            </div>
            <div>
              <label className="text-xs text-stone-400 block mb-1">Target UTR</label>
              <div className="flex items-center gap-3">
                <input type="range" min="0" max="3" step="0.1" value={targetUtr} onChange={e => setTargetUtr(Number(e.target.value))} className="w-32"/>
                <span className="text-white font-bold w-12">{targetUtr}</span>
              </div>
            </div>
          </div>

          {/* Summary cards */}
          {riderSummary && (
            <div className="grid grid-cols-3 gap-3">
              <MetricCard title="Total Active Riders" value={riderSummary.totalActive?.toLocaleString()} icon="🧑‍🤝‍🧑"
                sub="Inferred from Orders ÷ UTR ÷ Days" />
              <MetricCard title="Riders Needed" value={riderSummary.totalNeeded?.toLocaleString()} icon="🎯"
                sub={`At target UTR ${targetUtr}`} />
              <MetricCard title="Net Gap"
                value={riderSummary.totalGap != null ? (riderSummary.totalGap > 0 ? `+${riderSummary.totalGap?.toLocaleString()}` : riderSummary.totalGap?.toLocaleString()) : null}
                icon={riderSummary.totalGap > 0 ? '⚠️' : '✅'}
                color={riderSummary.totalGap > 0 ? 'metric-negative' : riderSummary.totalGap < 0 ? 'metric-positive' : 'text-white'}
                sub={riderSummary.totalGap > 0 ? 'Deficit — need more riders' : riderSummary.totalGap < 0 ? 'Surplus — riders over-allocated' : 'Balanced'} />
            </div>
          )}

          {/* Per-city table */}
          <div className="card p-5">
            <div className="text-sm font-semibold text-white mb-3">Rider Analysis by City</div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-xs text-stone-500 uppercase border-b border-stone-800">
                    <th className="text-left py-2 pr-4">City</th>
                    <th className="text-right py-2 pr-4">Orders</th>
                    <th className="text-right py-2 pr-4">Avg UTR</th>
                    <th className="text-right py-2 pr-4">Active Riders</th>
                    <th className="text-right py-2 pr-4">Riders Needed</th>
                    <th className="text-right py-2 pr-4">Gap</th>
                    <th className="text-right py-2 pr-4">Gap %</th>
                    <th className="text-left py-2">Status</th>
                  </tr>
                </thead>
                <tbody>
                  {riderData.map(row => (
                    <tr key={row.city} className="border-b border-stone-800/50 hover:bg-orange-950/20 transition-colors">
                      <td className="py-2 pr-4 font-medium text-white">{row.city}</td>
                      <td className="text-right py-2 pr-4 text-stone-300">{row.orders?.toLocaleString()}</td>
                      <td className={`text-right py-2 pr-4 ${row.utr != null && row.utr >= targetUtr ? 'metric-positive' : 'metric-negative'}`}>{row.utr ?? '—'}</td>
                      <td className="text-right py-2 pr-4 text-stone-300">{row.active?.toLocaleString() ?? '—'}</td>
                      <td className="text-right py-2 pr-4 text-stone-300">{row.needed?.toLocaleString() ?? '—'}</td>
                      <td className={`text-right py-2 pr-4 font-semibold ${row.gap > 0 ? 'metric-negative' : row.gap < 0 ? 'metric-positive' : 'text-white'}`}>
                        {row.gap != null ? (row.gap > 0 ? `+${row.gap.toLocaleString()}` : row.gap.toLocaleString()) : '—'}
                      </td>
                      <td className={`text-right py-2 pr-4 ${row.gapPct > 0 ? 'metric-negative' : row.gapPct < 0 ? 'metric-positive' : 'text-white'}`}>
                        {row.gapPct != null ? `${row.gapPct > 0 ? '+' : ''}${row.gapPct}%` : '—'}
                      </td>
                      <td className="py-2"><RiderBadge status={row.status}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Grouped bar chart */}
          {riderData.filter(d => d.active != null).length > 0 && (
            <div className="card p-5">
              <div className="text-sm font-semibold text-white mb-3">Active vs Needed Riders by City</div>
              <SimpleGroupedBarChart
                data={riderData.filter(d => d.active != null).map(d => ({ city:d.city, Active:d.active, Needed:d.needed }))}
                xKey="city"
                keys={[{key:'Active', color:COLORS.active, label:'Active (inferred)'}, {key:'Needed', color:COLORS.needed, label:'Needed (at target UTR)'}]}
                height={280}
              />
            </div>
          )}

          {/* City-level breakdown by month (when All is selected) */}
          {monthFilter === 'All' && (
            <div className="card p-4 text-xs text-stone-500">
              <span className="text-stone-400">Tip:</span> Select a specific month in the filter above to see rider counts for that month using its exact day count.
            </div>
          )}
        </div>
      )}

      <p className="text-center text-xs text-stone-700 mt-8">All processing happens in your browser — no data is sent to any server.</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
